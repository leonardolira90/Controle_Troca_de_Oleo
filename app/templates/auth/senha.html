{% extends 'base.html' %}
{% block titulo %}Alterar senha – {{ super() }}{% endblock %}
{% block conteudo %}
<h1>Alterar senha</h1>
<form method="post" class="formulario caixa-login"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Senha atual<input name="atual" type="password" autocomplete="current-password" required></label>
  <label>Nova senha<input name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Confirme a nova senha<input name="confirmacao" type="password" autocomplete="new-password" minlength="8" required></label>
  <div class="acoes">
    <button type="submit">Salvar</button>
    <a href="{{ url_for('main.index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
